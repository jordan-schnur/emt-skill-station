- text: "Failure to initiate or call for transport of the patient within 15 minute time limit"
  pearl: "Medical gets 15 minutes, not 10. Still — AMS, stroke signs, STEMI presentation, or anaphylaxis is load-and-go. Start thinking transport during your secondary assessment, not after. Verbalize 'calling for transport' before the clock runs out."
- text: "Failure to take or verbalize appropriate PPE precautions"
  pearl: "First words, every time. Medical scenes carry infectious disease risk — body fluids, respiratory illness, unknown substances. 'BSI precautions on' before you touch the patient, no exceptions. Examiners penalize silent gloving."
- text: "Failure to assess for and provide spinal protection when indicated"
  pearl: "Medical calls can hide mechanism. 'I fell and hit my head before I felt the chest pain' flips this from purely medical. If any fall, trauma, or LOC precedes symptoms, verbalize spinal consideration. The examiner is listening."
- text: "Failure to voice and ultimately provide high concentration oxygen"
  pearl: "Chest pain, shortness of breath, altered mental status, SpO2 < 94% — all get supplemental O2. Verbalize the device and LPM. Withholding O2 from a symptomatic patient and saying nothing will check this criterion."
- text: "Failure to assess/provide adequate ventilation"
  pearl: "RR < 8 or SpO2 unresponsive to O2 means the patient needs assisted ventilation. Say 'assisting ventilations with BVM and 100% O2' and do it. Noting 'respirations 6' without acting on it will fail you."
- text: "Failure to find or properly manage problems associated with airway, breathing, hemorrhage or shock"
  pearl: "Medical ABCs still come before the chief complaint. An altered patient needs an open airway before you ask about medications. Do not let a detailed OPQRST interview distract you from a patient who can't protect their airway."
- text: "Failure to differentiate patient's need for immediate transport versus continued assessment/treatment at the scene"
  pearl: "Stroke, STEMI, anaphylaxis, severe respiratory distress — these are load-and-go. Say 'priority transport' early and move. Detailed history happens in the ambulance. Time from symptom onset to definitive care changes outcomes."
- text: "Does other detailed/focused history or physical examination before assessing/treating threats to life"
  pearl: "OPQRST and SAMPLE come after the primary survey. If you dive into 'When did the pain start?' before managing an airway or SpO2 < 80%, the examiner checks this criterion. ABCs are non-negotiable first steps."
- text: "Failure to manage the patient as a competent EMT"
  pearl: "Think out loud throughout the scenario. Verbalize your clinical reasoning. If your interventions follow protocol and your sequence is logical, this stays unchecked. Examiners use this criterion rarely — but they will use it for grossly unsafe practice."
- text: "Orders or performs any harmful or dangerous procedure"
  pearl: "Aspirin needs confirmed indication and no contraindication (allergy, active bleeding, trauma). Oral glucose needs a patient who can swallow. Nitro needs BP > 90 and no PDE-5 inhibitors. Confirm before you give — every time."
