- text: "Failure to begin CPR within 30 seconds of scenario start"
  pearl: "The clock starts when you approach the patient. Responsiveness check, call for help, head-tilt/chin-lift, breathing check — these take 10 seconds. First compression lands before 30 seconds. There is no pulse check before starting CPR at this skill level."
- text: "Failure to ensure high quality CPR at all times"
  pearl: "2–2.4 inches depth on adults, full chest recoil between compressions, rate 100–120/min. Leaning on the chest between compressions collapses coronary perfusion pressure you just built. Lift fully — every single compression."
- text: "Interruption of CPR for greater than 10 seconds"
  pearl: "Pulse checks, pad placement, rhythm analysis, ventilations — all must fit in 10 seconds. Pre-charge while CPR is running; resume within 10 seconds of every shock. The examiner is timing your pauses. Minimize transition time obsessively."
- text: "Failure to take or verbalize appropriate PPE precautions"
  pearl: "First words before you touch anything. 'Gloves on.' CPR involves direct patient contact and potential exposure to secretions. Examiners fail candidates who skip verbalization — even if you're already wearing gloves from the last call."
- text: "Failure to provide shock for shockable rhythm"
  pearl: "If the AED says 'shock advised,' you shock — every time, no hesitation. Clear everyone (including yourself), deliver the shock, and immediately resume CPR. Never delay a shock to check for a pulse. The AED has already checked."
- text: "Failure to ensure that ventilations are being delivered"
  pearl: "Compressions win attention, but ventilations matter. 30:2 before advanced airway — count out loud. Visible chest rise confirms seal and volume. With an advanced airway, 10 breaths/min asynchronous. If no chest rise, reposition and recheck the mask seal."
