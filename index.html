<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="description" content="NREMT Psychomotor Skill Sheet study helper with interactive drills and reference sheets" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NREMT Skill Sheet Trainer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/hand-pulse-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/hand-pulse-16.png" />
  <link rel="icon" type="image/svg+xml" href="images/hand-pulse.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/hand-pulse-180.png" />
</head>
<body>
  <header class="topbar">
    <button class="brand" data-nav="home" type="button">
      <img src="images/hand-pulse.svg" alt="" class="brand-logo" width="36" height="36" aria-hidden="true" />
      <span class="brand-text">
        <span class="brand-mark">NREMT</span>
        <span class="brand-sub">Psychomotor Trainer</span>
      </span>
    </button>
    <nav class="topnav">
      <button data-nav="home" type="button">Today</button>
      <button data-nav="mnemonics" type="button">Mnemonics</button>
      <button data-nav="medconditions" type="button">Medical</button>
      <button data-nav="chat" type="button">AI Chat</button>
      <button data-nav="examday" type="button">Exam Day</button>
    </nav>
    <div class="topbar-right">
      <span id="streak-pill" class="streak-pill" hidden>
        <span class="streak-emoji">🔥</span>
        <span class="streak-text"></span>
      </span>
      <div class="topbar-menu" id="topbar-menu">
        <button class="topbar-menu-btn" type="button" aria-label="More options" id="topbar-menu-btn">⚙</button>
        <div class="topbar-menu-pop" role="menu">
          <button data-nav="stats" type="button">Stats</button>
          <button data-nav="settings" type="button">Backup &amp; sync</button>
          <button data-nav="guide" type="button">Guide</button>
          <button data-nav="sources" type="button">Sources &amp; Disclaimer</button>
        </div>
      </div>
    </div>
  </header>

  <main id="root" class="root"></main>

  <footer class="footer">
    <div class="footer-left">
      <span class="footer-copyright">© 2026 NREMT Skill Trainer</span>
      <button class="footer-link" data-nav="sources" type="button">Sources</button>
      <span class="footer-disclaimer">Not medical advice</span>
    </div>
    <span id="footer-status" class="footer-status">Loading…</span>
  </footer>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
