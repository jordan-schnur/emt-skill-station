<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="description" content="NREMT Psychomotor Skill Sheet study helper with spaced repetition and interactive flashcards" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NREMT Skill Sheet Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />

<body>
  <header class="topbar">
    <button class="brand" data-nav="home" type="button">

      <span class="brand-sub">Psychomotor Trainer</span>

    <nav class="topnav">
