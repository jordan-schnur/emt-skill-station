<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="description" content="NREMT Psychomotor Skill Sheet study helper with interactive drills and reference sheets" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NREMT Skill Sheet Trainer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/hand-pulse-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/hand-pulse-16.png" />
  <link rel="icon" type="image/svg+xml" href="images/hand-pulse.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/hand-pulse-180.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" data-nav="home" type="button">
      <img src="images/hand-pulse.svg" alt="" class="brand-logo" width="36" height="36" aria-hidden="true" />
      <span class="brand-text">
        <span class="brand-mark">NREMT</span>
        <span class="brand-sub">Psychomotor Trainer</span>
      </span>
    </button>
    <nav class="topnav">
      <button data-nav="home" type="button">Home</button>
      <button data-nav="mnemonics" type="button">Mnemonics</button>
      <button data-nav="medconditions" type="button">Medical</button>
      <button data-nav="stats" type="button">Stats</button>
      <button data-nav="settings" type="button">Backup</button>
      <button data-nav="guide" type="button">Guide</button>
      <button data-nav="chat" type="button">AI Chat</button>
    </nav>
  </header>

  <main id="root" class="root"></main>

  <footer class="footer">
    <span id="footer-status">Loading…</span>
  </footer>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>

  <!-- Data comes first; everything else depends on window.NREMT_DATA -->
  <script src="js/marked.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mnemonics.js"></script>
  <script src="js/ems_clinical_mnemonics.js"></script>
  <script src="js/medical_conditions.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
