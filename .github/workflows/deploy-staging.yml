name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and deploy to staging'
        required: true
        default: 'feature/preact-vite-migration'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - name: Build (staging)
        run: npm run build -- --mode staging
        env:
          VITE_BASE: /emt-skill-station/staging/

      - name: Deploy to gh-pages /staging
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: staging
          keep_files: true

      - name: Copy smart 404 to root (fixes SPA routing for /staging/* paths)
        run: mkdir -p /tmp/spa-404 && cp dist/404.html /tmp/spa-404/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/spa-404
          keep_files: true
