name: Tests

on:
  push:
    branches: [main]
    tags: ['e2e-*']
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit and integration tests
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  python-tests:
    name: Python Data Validation Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pdfplumber

      - name: Run Python tests
        run: python -m pytest tests/test_preprocess.py -v

      - name: Verify data generation
        run: python3 preprocess.py

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Check test coverage thresholds
        run: npm test
        continue-on-error: true

      - name: Display coverage summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const c = require('./coverage/coverage-summary.json').total; console.log('Coverage:', Object.keys(c).map(k => k + ': ' + c[k].pct + '%').join(', '))"
          fi

  results:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, python-tests, code-quality]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.python-tests.result }}" = "failure" ] || \
             [ "${{ needs.code-quality.result }}" = "failure" ]; then
            echo "Some tests failed"
            exit 1
          else
            echo "All tests passed"
          fi
