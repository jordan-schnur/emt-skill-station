name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit and integration tests
        run: npm test -- --coverage --watchAll=false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  browser-tests:
    name: Browser UI Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run browser tests
        run: npm run test:e2e:browser

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  python-tests:
    name: Python Data Validation Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pdfplumber

      - name: Run Python tests
        run: python -m pytest tests/test_preprocess.py -v

      - name: Verify data generation
        run: python3 preprocess.py

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check test coverage thresholds
        run: npm test -- --coverage --watchAll=false --passWithNoTests
        continue-on-error: true

      - name: Display coverage summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const c = require('./coverage/coverage-summary.json').total; console.log('Coverage:', Object.keys(c).map(k => k + ': ' + c[k].pct + '%').join(', '))"
          fi

  results:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, browser-tests, python-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.browser-tests.result }}" = "failure" ] || \
             [ "${{ needs.python-tests.result }}" = "failure" ]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi

  report:
    name: Post Test Report
    runs-on: ubuntu-latest
    if: always()
    needs: [unit-tests, browser-tests, python-tests]

    steps:
      - name: Create test summary
        uses: actions/github-script@v6
        with:
          script: |
            const unitResult = '${{ needs.unit-tests.result }}';
            const browserResult = '${{ needs.browser-tests.result }}';
            const pythonResult = '${{ needs.python-tests.result }}';

            const status = [unitResult, browserResult, pythonResult].every(r => r === 'success') ? '✅ PASSED' : '❌ FAILED';

            const summary = `
            ## Test Results ${status}

            | Test Suite | Status |
            |-----------|--------|
            | Unit & Integration Tests | ${unitResult === 'success' ? '✅' : '❌'} |
            | Browser UI Tests | ${browserResult === 'success' ? '✅' : '❌'} |
            | Python Data Tests | ${pythonResult === 'success' ? '✅' : '❌'} |

            ### Details
            - **Unit/Integration**: Jest tests, coverage report uploaded to Codecov
            - **Browser Tests**: Playwright E2E tests with real browser automation
            - **Data Validation**: Python tests for PDF data structure and integrity
            `;

            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }
