- text: "Failure to initiate ventilations within 30 seconds"
  pearl: "Thirty seconds is your entire opening window. Open the airway, confirm apnea, and deliver the first breath before anything else. Practice until your hands reach for the BVM before you finish your scene size-up."
- text: "Interrupts ventilations for greater than 30 seconds at a time"
  pearl: "The examiner counts your gaps. Suction, intubation, equipment changes — none can pause ventilations beyond 30 seconds. If suctioning takes longer, hand the BVM to your partner. Every gap harms the patient and scores against you."
- text: "Failure to take or verbalize appropriate PPE precautions"
  pearl: "BVM ventilation puts you face-to-face with aerosolized secretions. Gloves AND eye protection — verbalize both before you touch anything. 'PPE on, gloves and eye protection' is your opening line."
- text: "Failure to voice and ultimately provide high concentration oxygen"
  pearl: "Your BVM must be connected to O2 at 15 LPM with the reservoir bag attached. Without both, you're delivering room air (21% O2) instead of near-100%. Verbalize the connection rate: 'O2 at 15 LPM, reservoir attached.'"
- text: "Failure to assess for and provide spinal protection when indicated"
  pearl: "Even an airway-focused station can involve a trauma mechanism. If the patient had a fall or collision, verbalize 'maintaining spinal precautions' while you manage the airway. You can head-tilt for airway control and note spinal concern simultaneously."
- text: "Failure to manage the patient as a competent EMT"
  pearl: "One breath every 5–6 seconds (10–12/min for adults), visible chest rise each time, minimal gastric distention, reassess position and seal constantly. Hyperventilation harms — set your rate and keep it. Show control, not urgency."
